<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>HotCopy 管理员面板与数据资产导出</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-8 min-h-screen">
  <div class="max-w-5xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <div class="flex items-center gap-2">
        <span class="font-bold text-lg text-rose-500">HotCopy</span>
        <span class="text-xs text-slate-400">运营管控与微调资产面板</span>
      </div>
      <div class="flex gap-2">
        <input id="adminKey" type="password" placeholder="输入 ADMIN_KEY" class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded text-xs">
        <button onclick="fetchStats()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs px-3 py-1.5 rounded font-medium">验证载入</button>
      </div>
    </div>

    <!-- 概览看板 -->
    <div class="grid grid-cols-3 gap-4 mb-6">
      <div class="bg-slate-800 p-4 rounded-lg">
        <div class="text-xs text-slate-400">总注册用户</div>
        <div id="statTotal" class="text-2xl font-bold mt-1">0</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-lg">
        <div class="text-xs text-slate-400">付费活跃会员</div>
        <div id="statPaid" class="text-2xl font-bold mt-1 text-emerald-400">0</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-lg border border-rose-500/40">
        <div class="text-xs text-slate-400">已沉淀 SFT 微调语料 (条)</div>
        <div id="statSft" class="text-2xl font-bold mt-1 text-rose-400">0</div>
      </div>
    </div>

    <!-- Cookies 通行证健康状态与一键热更新 -->
    <div class="bg-slate-800 p-4 rounded-lg mb-6 border border-slate-700">
      <div class="flex justify-between items-center">
        <div>
          <div class="text-xs font-bold text-slate-200 flex items-center gap-2">
            <span>YouTube 全网解析通行证 (Cookies) 状态</span>
            <span id="cookieBadge" class="text-[10px] px-2 py-0.5 rounded bg-emerald-900 text-emerald-300 font-semibold">🟢 正常工作中</span>
          </div>
          <div class="text-[11px] text-slate-400 mt-1" id="cookieInfo">已挂载通行凭证，全网任意无字幕长视频均可畅通下载与听写。</div>
        </div>
        <button onclick="toggleCookieUpdate()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-3 py-1.5 rounded transition">
          更新通行证
        </button>
      </div>
      <div id="cookieUpdateBox" class="hidden mt-3 pt-3 border-t border-slate-700">
        <textarea id="cookieInput" placeholder="在此粘贴 Chrome 导出的 cookies.txt 全部文本内容..." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-[11px] font-mono text-slate-300 h-28 mb-2 focus:outline-none focus:border-rose-500"></textarea>
        <div class="flex justify-end gap-2">
          <button onclick="toggleCookieUpdate()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1 rounded text-slate-300">取消</button>
          <button onclick="saveCookies()" class="bg-rose-600 hover:bg-rose-500 text-xs px-4 py-1 rounded font-semibold text-white">保存并立即生效</button>
        </div>
      </div>
    </div>

    <!-- SFT 数据集一键打包下载 -->
    <div class="bg-slate-800 p-4 rounded-lg mb-6 flex justify-between items-center border border-rose-500/20">
      <div>
        <h4 class="text-xs font-bold text-rose-300">打包导出高质量 SFT 训练集</h4>
        <p class="text-[11px] text-slate-400 mt-0.5">自动导出包含 instruction, input, output 的标准 JSONL 语料，用于直接交付或模型微调。</p>
      </div>
      <button onclick="downloadDataset()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs px-4 py-2 rounded-lg font-semibold flex items-center gap-1.5">
        导出 hotcopy_sft_dataset.jsonl
      </button>
    </div>

    <!-- 手动调整套餐 -->
    <div class="bg-slate-800 p-4 rounded-lg mb-6 flex gap-3 items-center">
      <input id="targetEmail" placeholder="指定用户邮箱" class="bg-slate-900 border border-slate-700 px-3 py-1.5 text-xs rounded flex-1">
      <select id="targetPlan" class="bg-slate-900 border border-slate-700 px-3 py-1.5 text-xs rounded">
        <option value="basic">基础版 (50次/月)</option>
        <option value="pro">Pro 版 (100次/月)</option>
        <option value="premium">高级版 (300次/月)</option>
      </select>
      <button onclick="manualUpgrade()" class="bg-emerald-600 text-xs px-4 py-1.5 rounded font-medium">确认调整/延期 30 天</button>
    </div>

    <!-- 用户明细 -->
    <div class="bg-slate-800 rounded-lg overflow-hidden">
      <table class="w-full text-xs text-left">
        <thead class="bg-slate-950 text-slate-400">
          <tr>
            <th class="p-3">ID</th>
            <th class="p-3">邮箱</th>
            <th class="p-3">套餐</th>
            <th class="p-3">当月已用 / 总限额</th>
            <th class="p-3">到期时间</th>
          </tr>
        </thead>
        <tbody id="userListBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
      ? 'http://localhost:3001' 
      : 'https://api.eazyopc.com';

    async function fetchStats() {
      const key = document.getElementById('adminKey').value;
      const res = await fetch(`${API}/api/admin/stats`, { headers: { 'x-admin-key': key } });
      if (!res.ok) return alert('验证密钥失败');
      const data = await res.json();
      document.getElementById('statTotal').innerText = data.totalUsers;
      document.getElementById('statPaid').innerText = data.paidUsers;
      document.getElementById('statSft').innerText = data.sftDataCount;
      document.getElementById('userListBody').innerHTML = data.users.map(u => `
        <tr class="border-t border-slate-700">
          <td class="p-3 font-mono">${u.id}</td>
          <td class="p-3">${u.email}</td>
          <td class="p-3"><span class="px-2 py-0.5 rounded ${u.plan === 'premium' ? 'bg-amber-900 text-amber-300' : u.plan === 'pro' ? 'bg-rose-900 text-rose-300' : 'bg-slate-700'}">${u.plan.toUpperCase()}</span></td>
          <td class="p-3 font-mono">${u.used_count} / ${u.monthly_limit}</td>
          <td class="p-3 text-slate-400">${new Date(u.expires_at).toLocaleDateString()}</td>
        </tr>
      `).join('');
      fetchCookieStatus();
    }

    function downloadDataset() {
      const key = document.getElementById('adminKey').value;
      if (!key) return alert('请先输入 ADMIN_KEY');
      window.open(`${API}/api/admin/export-dataset?x-admin-key=${encodeURIComponent(key)}`);
    }

    async function manualUpgrade() {
      const key = document.getElementById('adminKey').value;
      const email = document.getElementById('targetEmail').value;
      const plan = document.getElementById('targetPlan').value;
      const res = await fetch(`${API}/api/admin/upgrade`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-key': key },
        body: JSON.stringify({ email, plan, days: 30 })
      });
      const d = await res.json();
      fetchStats();
    }

    async function fetchCookieStatus() {
      const key = document.getElementById('adminKey').value;
      if (!key) return;
      try {
        const res = await fetch(`${API}/api/admin/cookies-status`, { headers: { 'x-admin-key': key } });
        const d = await res.json();
        const badge = document.getElementById('cookieBadge');
        const info = document.getElementById('cookieInfo');
        if (d.status === 'ok') {
          badge.className = 'text-[10px] px-2 py-0.5 rounded bg-emerald-900 text-emerald-300 font-semibold';
          badge.innerText = '🟢 正常工作中';
          info.innerText = `通行凭证有效 (${(d.size / 1024).toFixed(1)} KB)，更新于 ${new Date(d.updatedAt).toLocaleString()}。`;
        } else {
          badge.className = 'text-[10px] px-2 py-0.5 rounded bg-rose-900 text-rose-300 font-semibold';
          badge.innerText = '🔴 凭证已缺失或失效';
          info.innerText = '当前通行证缺失，无字幕长视频可能会触发 YouTube 机房防爬拦截，请点击右侧更新。';
        }
      } catch (e) {}
    }

    function toggleCookieUpdate() {
      const box = document.getElementById('cookieUpdateBox');
      box.classList.toggle('hidden');
    }

    async function saveCookies() {
      const key = document.getElementById('adminKey').value;
      const content = document.getElementById('cookieInput').value.trim();
      if (!content) return alert('请先粘贴 cookies.txt 内容');
      const res = await fetch(`${API}/api/admin/cookies-update`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-key': key },
        body: JSON.stringify({ cookiesContent: content })
      });
      const d = await res.json();
      if (res.ok) {
        alert('Cookies 通行证已更新成功！');
        document.getElementById('cookieInput').value = '';
        toggleCookieUpdate();
        fetchCookieStatus();
      } else {
        alert(d.error || '更新失败');
      }
    }
  </script>
</body>
</html>
